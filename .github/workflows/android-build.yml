name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_APP_SECRET: ${{ secrets.RELAY_APP_SECRET }}
        run: gradle test --no-daemon

      - name: Run lint
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_APP_SECRET: ${{ secrets.RELAY_APP_SECRET }}
        run: gradle lint --no-daemon

      - name: Build debug APK
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_APP_SECRET: ${{ secrets.RELAY_APP_SECRET }}
        run: gradle assembleDebug --no-daemon

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "RELEASE_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_APP_SECRET: ${{ secrets.RELAY_APP_SECRET }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tva-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tva-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
